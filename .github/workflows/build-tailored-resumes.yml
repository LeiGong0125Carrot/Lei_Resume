name: Build tailored resume PDFs

on:
  push:
    branches:
      - main
      - 'resumes/**'
      - 'layout/**'
    paths:
      - 'resumes/**'
      - main.tex
      - '.github/workflows/build-tailored-resumes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile individual job resumes
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resumes/*_resume.tex
          work_in_root_file_dir: true
      - name: Compile root Overleaf preview file
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
      - name: Verify PDF count and inventory
        run: |
          find resumes -maxdepth 1 -type f -name '*_resume.pdf' -print | sort > compiled_pdfs.txt
          source_count=$(find resumes -maxdepth 1 -type f -name '*_resume.tex' | wc -l)
          pdf_count=$(wc -l < compiled_pdfs.txt)
          echo "Sources: $source_count | PDFs: $pdf_count"
          cat compiled_pdfs.txt
          test "$source_count" -eq "$pdf_count"
          test -f main.pdf
      - name: Check Nov 1 one-page PDFs and ATS-extractable text
        run: |
          command -v pdfinfo
          command -v pdftotext
          for tex in resumes/Benchling_Research_Engineer_Model_Evaluation_and_Improvement_resume.tex resumes/Epsilon_Health_Research_Engineer_Data_Quality_and_Evaluations_resume.tex resumes/Spotify_Research_Scientist_Personalization_resume.tex resumes/Prime_Intellect_Research_Engineer_Data_and_Evaluation_resume.tex resumes/HUD_Research_Engineer_Robotics_Data_resume.tex resumes/Nolla_Health_Research_Engineer_Evals_and_RL_Environments_resume.tex resumes/Nomura_AI_Engineer_resume.tex resumes/Color_Health_Software_Engineer_New_Grad_2026_resume.tex; do
            pdf="${tex%.tex}.pdf"
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            chars=$(pdftotext "$pdf" - | tr -d '[:space:]' | wc -c)
            echo "$pdf pages=$pages extracted_chars=$chars"
            test "$pages" -eq 1
            test "$chars" -gt 300
          done
      - name: Upload PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resumes-flat
          path: |
            resumes/*_resume.pdf
            compiled_pdfs.txt
          if-no-files-found: error
