name: Build tailored resume PDFs

on:
  push:
    branches:
      - main
      - 'resumes/**'
      - 'layout/**'
    paths:
      - 'resumes/**'
      - main.tex
      - '.github/workflows/build-tailored-resumes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile individual job resumes
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resumes/*_resume.tex
          work_in_root_file_dir: true
      - name: Compile root Overleaf preview file
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
      - name: Verify PDF count and inventory
        run: |
          find resumes -maxdepth 1 -type f -name '*_resume.pdf' -print | sort > compiled_pdfs.txt
          source_count=$(find resumes -maxdepth 1 -type f -name '*_resume.tex' | wc -l)
          pdf_count=$(wc -l < compiled_pdfs.txt)
          echo "Sources: $source_count | PDFs: $pdf_count"
          cat compiled_pdfs.txt
          test "$source_count" -eq "$pdf_count"
          test -f main.pdf
      - name: Verify each PDF is exactly one page
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          failures=0
          for pdf in resumes/*_resume.pdf main.pdf; do
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            echo "$pdf: $pages page(s)"
            if [ "$pages" != "1" ]; then
              echo "::error file=$pdf::Expected one page; got $pages"
              failures=1
            fi
          done
          exit "$failures"
      - name: Upload PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resumes-flat
          path: |
            resumes/*_resume.pdf
            compiled_pdfs.txt
          if-no-files-found: error
